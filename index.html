<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro de Ocorrências</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    crossorigin="anonymous">
  <style>
    body {
      background-color: #f0f4f8;
    }

    .section-card {
      background: #fff;
    }

    /* Títulos das seções com indicador de status */
    .section-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: background-color 0.2s;
    }

    .status-dot.ok {
      background-color: #198754;
    }

    .status-dot.alerta {
      background-color: #dc3545;
    }

    /* Checkboxes maiores para celular */
    .form-check-input {
      width: 1.3em;
      height: 1.3em;
      margin-top: 0.1em;
      cursor: pointer;
    }

    .form-check-label {
      cursor: pointer;
      font-size: 1rem;
      padding-left: 0.4rem;
    }

    .form-check {
      display: flex;
      align-items: center;
    }

    #relatorio {
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 0.9rem;
      min-height: 60px;
    }

    /* Botão limpar isolado no topo */
    #limparBtn {
      font-size: 0.8rem;
      padding: 0.3rem 0.75rem;
    }

    /* Garante 2 colunas max em mobile nas chaves */
    @media (max-width: 575px) {
      .row-cols-chaves {
        --bs-columns: 2;
      }
    }
  </style>
</head>

<body>

  <!-- Botão Limpar isolado no topo, longe das ações principais -->
  <div class="d-flex justify-content-end px-4 pt-3">
    <button id="limparBtn" class="btn btn-outline-danger">🗑️ Limpar tudo</button>
  </div>

  <h1 class="text-center fw-bold fs-2 pb-3">📓 Registro de Ocorrências</h1>

  <div class="content">

    <!-- ═══════════════ VIGIA ═══════════════ -->
    <div id="sec-vigia" class="section-card border border-primary rounded-3 p-4 m-3">
      <div class="section-title">
        <span class="status-dot ok" id="dot-vigia"></span>
        👤 VIGIA
      </div>
      <div class="row g-3">
        <div class="col-12 col-md-6">
          <label for="nomeOperador" class="form-label fw-semibold">Nome do Vigia</label>
          <input type="text" class="form-control form-control-lg" id="nomeOperador" placeholder="Nome completo">
        </div>
        <div class="col-6 col-md-2">
          <label for="turno" class="form-label fw-semibold">Turno</label>
          <select class="form-select form-select-lg" id="turno">
            <option value="" disabled selected>Selecione</option>
            <option value="Diurno (07h–19h)">☀️ Diurno (07h–19h)</option>
            <option value="Noturno (19h–07h)">🌙 Noturno (19h–07h)</option>
          </select>
        </div>
        <div class="col-6 col-md-2">
          <label for="dataAtual" class="form-label fw-semibold">Data <span
              class="text-muted fw-normal small">(dd/mm/aa)</span></label>
          <input type="text" class="form-control form-control-lg" id="dataAtual" placeholder="dd/mm/aa">
        </div>
        <div class="col-6 col-md-2">
          <label for="horaAtual" class="form-label fw-semibold">Hora <span
              class="text-muted fw-normal small">(hh:mm)</span></label>
          <input type="text" class="form-control form-control-lg" id="horaAtual" placeholder="hh:mm">
        </div>
      </div>
    </div>

    <!-- ═══════════════ CHAVES ═══════════════ -->
    <div id="sec-chaves" class="section-card border border-primary rounded-3 p-4 m-3">
      <div class="section-title">
        <span class="status-dot ok" id="dot-chaves"></span>
        🔑 CHAVES NO QUADRO
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="checkTodasChaves" checked>
        <label class="form-check-label fw-semibold" for="checkTodasChaves">Todas as chaves estão presentes no
          quadro</label>
      </div>
      <div id="detalheChaves" class="d-none">
        <p class="text-muted mb-2">Marque as chaves que estão <strong>faltando</strong> no quadro:</p>
        <div class="row row-cols-2 row-cols-md-3 g-2 mb-3" id="chaves-lista"></div>
        <label for="obsChaves" class="form-label fw-semibold">Observações:</label>
        <textarea class="form-control" id="obsChaves" rows="2"
          placeholder="Detalhes adicionais sobre as chaves..."></textarea>
      </div>
    </div>

    <!-- ═══════════════ CÂMERAS ═══════════════ -->
    <div id="sec-cameras" class="section-card border border-primary rounded-3 p-4 m-3">
      <div class="section-title">
        <span class="status-dot ok" id="dot-cameras"></span>
        📷 CÂMERAS
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="checkCameras" checked>
        <label class="form-check-label" for="checkCameras">Todas as câmeras estão ok</label>
      </div>
      <div id="selectCameras" class="d-none">
        <label for="numCameras" class="form-label fw-semibold">Quantidade inoperante:</label>
        <select class="form-select mb-3" id="numCameras">
          <option value="" selected disabled>Escolha uma opção</option>
          <option value="1">1 câmera inoperante</option>
          <option value="2">2 câmeras inoperantes</option>
          <option value="3">3 câmeras inoperantes</option>
          <option value="4">4 câmeras inoperantes</option>
          <option value="5">5 câmeras inoperantes</option>
          <option value="varias">Mais de 5 câmeras inoperantes</option>
          <option value="all">Todas as câmeras inoperantes</option>
        </select>
        <label for="obsCameras" class="form-label fw-semibold">Detalhes do problema:</label>
        <textarea class="form-control" id="obsCameras" rows="2"
          placeholder="Descreva o problema encontrado..."></textarea>
      </div>
    </div>

    <!-- ═══════════════ SISTEMAS ═══════════════ -->
    <div id="sec-sistemas" class="section-card border border-primary rounded-3 p-4 m-3">
      <div class="section-title">
        <span class="status-dot ok" id="dot-sistemas"></span>
        💻 SISTEMAS
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="checkSistemas" checked>
        <label class="form-check-label" for="checkSistemas">Todos os sistemas estão ok</label>
      </div>
      <div id="detalheSistemas" class="d-none">
        <p class="text-muted mb-2">Marque os sistemas com problema:</p>
        <div class="row row-cols-1 row-cols-md-2 g-2 mb-3" id="sistemas-lista"></div>
        <label for="obsSistemas" class="form-label fw-semibold">Detalhes do problema:</label>
        <textarea class="form-control" id="obsSistemas" rows="2"
          placeholder="Descreva o problema encontrado..."></textarea>
      </div>
    </div>

    <!-- ═══════════════ GUARITA ═══════════════ -->
    <div id="sec-guarita" class="section-card border border-primary rounded-3 p-4 m-3">
      <div class="section-title">
        <span class="status-dot ok" id="dot-guarita"></span>
        🏠 GUARITA
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="checkGuarita" checked>
        <label class="form-check-label" for="checkGuarita">Guarita em perfeitas condições</label>
      </div>
      <div id="detalheGuarita" class="d-none">
        <p class="text-muted mb-2">Marque os itens com problema:</p>
        <div class="row row-cols-1 row-cols-md-2 g-2 mb-3" id="guarita-lista"></div>
        <label for="obsGuarita" class="form-label fw-semibold">Detalhes do problema:</label>
        <textarea class="form-control" id="obsGuarita" rows="2"
          placeholder="Descreva o problema encontrado..."></textarea>
      </div>
    </div>

    <!-- ═══════════════ ENCOMENDAS ═══════════════ -->
    <div id="sec-encomendas" class="section-card border border-primary rounded-3 p-4 m-3">
      <div class="section-title">
        <span class="status-dot ok" id="dot-encomendas"></span>
        📦 ENCOMENDAS
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="checkEncomendas" checked>
        <label class="form-check-label" for="checkEncomendas">Sem pendências de encomendas</label>
      </div>
      <div id="detalheEncomendas" class="d-none">
        <label for="obsEncomendas" class="form-label fw-semibold">Descreva a situação:</label>
        <textarea class="form-control" id="obsEncomendas" rows="3"
          placeholder="Ex: encomenda aguardando retirada no apto 101..."></textarea>
      </div>
    </div>

    <!-- ═══════════════ OUTROS ═══════════════ -->
    <div id="sec-outros" class="section-card border border-primary rounded-3 p-4 m-3">
      <div class="section-title">
        <span class="status-dot ok" id="dot-outros"></span>
        📝 OUTRAS OCORRÊNCIAS
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="checkOutros" checked>
        <label class="form-check-label" for="checkOutros">Sem outras ocorrências</label>
      </div>
      <div id="detalheOutros" class="d-none">
        <label for="obsOutros" class="form-label fw-semibold">Descreva os eventos / ocorrências:</label>
        <textarea class="form-control" id="obsOutros" rows="4"
          placeholder="Descreva os eventos ou ocorrências não listados acima..."></textarea>
      </div>
    </div>

    <!-- ═══════════════ RELATÓRIO ═══════════════ -->
    <div class="section-card border border-primary rounded-3 p-4 m-3 mb-5">
      <h2 class="text-center fw-bold fs-4 mb-3">📊 RELATÓRIO</h2>
      <div id="relatorio" class="p-3 bg-light rounded border mb-3"></div>
      <!-- Copiar gera+copia em um único toque -->
      <button id="copyBtn" class="btn btn-success btn-lg w-100">📋 Gerar e Copiar para WhatsApp</button>
    </div>

  </div><!-- /content -->

  <script>
    // ── DADOS ──────────────────────────────────
    const CHAVES = [
      'Salão 1', 'Salão 2', 'Salão 3', 'Salão 4', 'Portaria',
      'Hidrômetro Bloco 1', 'Hidrômetro Bloco 2', 'Hidrômetro Bloco 3', 'Hidrômetro Bloco 4', 'Hidrômetro Bloco 5',
      'Piscina',
      'Área Técnica Bloco 1', 'Área Técnica Bloco 2', 'Área Técnica Bloco 3', 'Área Técnica Bloco 4', 'Área Técnica Bloco 5',
      'Telhado Bloco 1', 'Telhado Bloco 2', 'Telhado Bloco 3', 'Telhado Bloco 4', 'Telhado Bloco 5', 'Outra'
    ];
    const SISTEMAS = [
      'MIP', 'INCONTROL', 'WINKER', 'Monitor das Câmeras', 'Notebook', 'Interfone',
      'Controle de abertura das cancelas',
      'Controle de abertura do portão de correr',
      'Controle de abertura do portão de pedestres', 'Outros'
    ];
    const GUARITA_ITENS = [
      'Iluminação', 'Limpeza do piso', 'Organização da bancada', 'Limpeza dos vidros',
      'Lixeira', 'Organização Encomendas', 'Limpeza das Telas', 'Limpeza Banheiro', 'Outro'
    ];

    // ── RENDER CHECKBOXES ──────────────────────
    function renderChecks(containerId, items, prefix) {
      const container = document.getElementById(containerId);
      items.forEach((item, i) => {
        const id = `${prefix}_${i}`;
        const col = document.createElement('div');
        col.className = 'col';
        col.innerHTML = `<div class="form-check">
          <input class="form-check-input" type="checkbox" id="${id}" data-group="${prefix}">
          <label class="form-check-label" for="${id}">${item}</label>
        </div>`;
        container.appendChild(col);
      });
    }
    renderChecks('chaves-lista', CHAVES, 'chave');
    renderChecks('sistemas-lista', SISTEMAS, 'sistema');
    renderChecks('guarita-lista', GUARITA_ITENS, 'guarita_item');

    // ── DATA / HORA ────────────────────────────
    function pad(n) { return String(n).padStart(2, '0'); }
    function dataHoraAgora() {
      const now = new Date();
      return {
        data: `${pad(now.getDate())}/${pad(now.getMonth() + 1)}/${String(now.getFullYear()).slice(-2)}`,
        hora: `${pad(now.getHours())}:${pad(now.getMinutes())}`
      };
    }

    // ── INDICADORES DE STATUS (bolinhas) ───────
    function atualizarDot(dotId, ok) {
      const dot = document.getElementById(dotId);
      if (!dot) return;
      dot.classList.toggle('ok', ok);
      dot.classList.toggle('alerta', !ok);
    }

    function atualizarTodosStatus() {
      // Vigia: ok se tiver nome e turno
      const temNome = document.getElementById('nomeOperador').value.trim() !== '';
      const temTurno = document.getElementById('turno').value !== '';
      atualizarDot('dot-vigia', temNome && temTurno);

      atualizarDot('dot-chaves', document.getElementById('checkTodasChaves').checked);
      atualizarDot('dot-cameras', document.getElementById('checkCameras').checked);
      atualizarDot('dot-sistemas', document.getElementById('checkSistemas').checked);
      atualizarDot('dot-guarita', document.getElementById('checkGuarita').checked);
      atualizarDot('dot-encomendas', document.getElementById('checkEncomendas').checked);
      atualizarDot('dot-outros', document.getElementById('checkOutros').checked);
    }

    // ── TOGGLES ────────────────────────────────
    function bindToggle(checkId, detalheId) {
      const chk = document.getElementById(checkId);
      const div = document.getElementById(detalheId);
      chk.addEventListener('change', () => div.classList.toggle('d-none', chk.checked));
    }

    document.getElementById('checkTodasChaves').addEventListener('change', function () {
      document.getElementById('detalheChaves').classList.toggle('d-none', this.checked);
    });
    document.getElementById('checkCameras').addEventListener('change', function () {
      document.getElementById('selectCameras').classList.toggle('d-none', this.checked);
    });
    bindToggle('checkSistemas', 'detalheSistemas');
    bindToggle('checkGuarita', 'detalheGuarita');
    bindToggle('checkEncomendas', 'detalheEncomendas');
    bindToggle('checkOutros', 'detalheOutros');

    // ── HELPERS ────────────────────────────────
    function getCheckedLabels(prefix) {
      return [...document.querySelectorAll(`[data-group="${prefix}"]:checked`)]
        .map(el => document.querySelector(`label[for="${el.id}"]`).textContent.trim());
    }

    // ── GERAR RELATÓRIO ────────────────────────
    let textoParaCopiar = '';

    function gerarRelatorio() {
      const tela = [];
      const wa = [];
      const sep = '─'.repeat(20);

      const dh = dataHoraAgora();
      const dataR = document.getElementById('dataAtual').value.trim() || dh.data;
      const horaR = document.getElementById('horaAtual').value.trim() || dh.hora;
      const turno = document.getElementById('turno').value || '(não informado)';

      function push(t, w) { tela.push(t); wa.push(w !== undefined ? w : t); }

      push('📓 RELATÓRIO DE OCORRÊNCIA', '📓 *RELATÓRIO DE OCORRÊNCIA*');
      push(sep);

      // Vigia
      const nome = document.getElementById('nomeOperador').value.trim() || '(não informado)';
      push(`👤 Vigia: ${nome}`, `👤 *Vigia:* ${nome}`);
      push(`🕐 Turno: ${turno}`, `🕐 *Turno:* ${turno}`);
      push(`📅 Data: ${dataR}  ⏰ Hora: ${horaR}`, `📅 *Data:* ${dataR}  ⏰ *Hora:* ${horaR}`);
      push(sep);

      // Chaves
      push('🔑 CHAVES NO QUADRO:', '🔑 *CHAVES NO QUADRO:*');
      if (document.getElementById('checkTodasChaves').checked) {
        push('  ✅ Todas as chaves presentes.');
      } else {
        const faltando = getCheckedLabels('chave');
        if (!faltando.length) {
          push('  ✅ Todas as chaves presentes.');
        } else {
          faltando.forEach(ch => push(`  ❌ Chave "${ch}" não está no quadro.`, `  ❌ Chave _${ch}_ não está no quadro.`));
        }
        const obsChaves = document.getElementById('obsChaves').value.trim();
        if (obsChaves) push(`  📝 Obs: ${obsChaves}`, `  📝 _Obs: ${obsChaves}_`);
      }
      push(sep);

      // Câmeras
      push('📷 CÂMERAS:', '📷 *CÂMERAS:*');
      if (document.getElementById('checkCameras').checked) {
        push('  ✅ Todas as câmeras funcionando normalmente.');
      } else {
        const val = document.getElementById('numCameras').value;
        let msg;
        if (val === 'all') msg = '❌ Todas as câmeras estão inoperantes!';
        else if (val === 'varias') msg = '⚠️ Mais de 5 câmeras inoperantes.';
        else if (val) msg = `⚠️ ${val} câmera(s) inoperante(s).`;
        else msg = '⚠️ Problema nas câmeras (sem detalhes).';
        push(`  ${msg}`);
        const obsCam = document.getElementById('obsCameras').value.trim();
        if (obsCam) push(`  📝 Obs: ${obsCam}`, `  📝 _Obs: ${obsCam}_`);
      }
      push(sep);

      // Sistemas
      push('💻 SISTEMAS:', '💻 *SISTEMAS:*');
      if (document.getElementById('checkSistemas').checked) {
        push('  ✅ Todos os sistemas funcionando normalmente.');
      } else {
        const p = getCheckedLabels('sistema');
        const obs = document.getElementById('obsSistemas').value.trim();
        if (p.length) push(`  ❌ Sistemas com problema: ${p.join(', ')}`, `  ❌ *Sistemas com problema:* ${p.join(', ')}`);
        else push('  ⚠️ Problema nos sistemas (nenhum item especificado).');
        if (obs) push(`  📝 Obs: ${obs}`, `  📝 _Obs: ${obs}_`);
      }
      push(sep);

      // Guarita
      push('🏠 GUARITA:', '🏠 *GUARITA:*');
      if (document.getElementById('checkGuarita').checked) {
        push('  ✅ Guarita em perfeitas condições.');
      } else {
        const p = getCheckedLabels('guarita_item');
        const obs = document.getElementById('obsGuarita').value.trim();
        if (p.length) push(`  ❌ Itens com problema: ${p.join(', ')}`, `  ❌ *Itens com problema:* ${p.join(', ')}`);
        else push('  ⚠️ Problema na guarita (nenhum item especificado).');
        if (obs) push(`  📝 Obs: ${obs}`, `  📝 _Obs: ${obs}_`);
      }
      push(sep);

      // Encomendas
      push('📦 ENCOMENDAS:', '📦 *ENCOMENDAS:*');
      if (document.getElementById('checkEncomendas').checked) {
        push('  ✅ Sem pendências de encomendas.');
      } else {
        const obs = document.getElementById('obsEncomendas').value.trim();
        const msg = obs || 'Pendência de encomendas (sem detalhes).';
        push(`  ⚠️ ${msg}`, `  ⚠️ _${msg}_`);
      }
      push(sep);

      // Outras ocorrências
      push('📝 OUTRAS OCORRÊNCIAS:', '📝 *OUTRAS OCORRÊNCIAS:*');
      if (document.getElementById('checkOutros').checked) {
        push('  ✅ Sem outras ocorrências.');
      } else {
        const obs = document.getElementById('obsOutros').value.trim();
        const msg = obs || 'Ocorrência registrada (sem detalhes).';
        push(`  ⚠️ ${msg}`, `  ⚠️ _${msg}_`);
      }
      push(sep);

      document.getElementById('relatorio').textContent = tela.join('\n');
      textoParaCopiar = wa.join('\n');
      salvarEstado();
      return textoParaCopiar;
    }

    // ── COPIAR (gera + copia em um toque) ──────
    document.getElementById('copyBtn').addEventListener('click', () => {
      const texto = gerarRelatorio();
      navigator.clipboard.writeText(texto).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = '✅ Copiado! Cole no WhatsApp.';
        btn.classList.replace('btn-success', 'btn-outline-success');
        setTimeout(() => {
          btn.textContent = '📋 Gerar e Copiar para WhatsApp';
          btn.classList.replace('btn-outline-success', 'btn-success');
        }, 3000);
      }).catch(() => {
        // fallback: só gera e avisa
        alert('Relatório gerado. Copie o texto acima manualmente.');
      });
    });

    // ── PERSISTÊNCIA ───────────────────────────
    function salvarEstado() {
      localStorage.setItem('livroOcorrencia', JSON.stringify({
        operador: document.getElementById('nomeOperador').value,
        turno: document.getElementById('turno').value,
        checkTodasChaves: document.getElementById('checkTodasChaves').checked,
        chavesFaltando: getCheckedLabels('chave'),
        obsChaves: document.getElementById('obsChaves').value,
        checkCameras: document.getElementById('checkCameras').checked,
        numCameras: document.getElementById('numCameras').value,
        obsCameras: document.getElementById('obsCameras').value,
        checkSistemas: document.getElementById('checkSistemas').checked,
        obsSistemas: document.getElementById('obsSistemas').value,
        sistemasMarcados: getCheckedLabels('sistema'),
        checkGuarita: document.getElementById('checkGuarita').checked,
        obsGuarita: document.getElementById('obsGuarita').value,
        guaritaMarcados: getCheckedLabels('guarita_item'),
        checkEncomendas: document.getElementById('checkEncomendas').checked,
        obsEncomendas: document.getElementById('obsEncomendas').value,
        checkOutros: document.getElementById('checkOutros').checked,
        obsOutros: document.getElementById('obsOutros').value,
      }));
    }

    function bool(val, def = true) { return val !== undefined ? val : def; }

    function restaurarEstado() {
      const raw = localStorage.getItem('livroOcorrencia');
      if (!raw) return;
      try {
        const e = JSON.parse(raw);
        if (e.operador) document.getElementById('nomeOperador').value = e.operador;
        if (e.turno) document.getElementById('turno').value = e.turno;

        // Chaves
        const ctc = bool(e.checkTodasChaves);
        document.getElementById('checkTodasChaves').checked = ctc;
        document.getElementById('detalheChaves').classList.toggle('d-none', ctc);
        marcarPorLabel('chave', e.chavesFaltando || []);
        document.getElementById('obsChaves').value = e.obsChaves || '';

        // Câmeras
        const cc = bool(e.checkCameras);
        document.getElementById('checkCameras').checked = cc;
        document.getElementById('selectCameras').classList.toggle('d-none', cc);
        if (e.numCameras) document.getElementById('numCameras').value = e.numCameras;
        document.getElementById('obsCameras').value = e.obsCameras || '';

        // Sistemas
        const cs = bool(e.checkSistemas);
        document.getElementById('checkSistemas').checked = cs;
        document.getElementById('detalheSistemas').classList.toggle('d-none', cs);
        document.getElementById('obsSistemas').value = e.obsSistemas || '';
        marcarPorLabel('sistema', e.sistemasMarcados || []);

        // Guarita
        const cg = bool(e.checkGuarita);
        document.getElementById('checkGuarita').checked = cg;
        document.getElementById('detalheGuarita').classList.toggle('d-none', cg);
        document.getElementById('obsGuarita').value = e.obsGuarita || '';
        marcarPorLabel('guarita_item', e.guaritaMarcados || []);

        // Encomendas
        const ce = bool(e.checkEncomendas);
        document.getElementById('checkEncomendas').checked = ce;
        document.getElementById('detalheEncomendas').classList.toggle('d-none', ce);
        document.getElementById('obsEncomendas').value = e.obsEncomendas || '';

        // Outros
        const co = bool(e.checkOutros);
        document.getElementById('checkOutros').checked = co;
        document.getElementById('detalheOutros').classList.toggle('d-none', co);
        document.getElementById('obsOutros').value = e.obsOutros || '';

      } catch (err) { console.warn('Erro ao restaurar:', err); }
    }

    function marcarPorLabel(prefix, labels) {
      document.querySelectorAll(`[data-group="${prefix}"]`).forEach(el => {
        const lbl = document.querySelector(`label[for="${el.id}"]`).textContent.trim();
        el.checked = labels.includes(lbl);
      });
    }

    // Salvar e atualizar status a cada interação
    document.addEventListener('change', () => { salvarEstado(); atualizarTodosStatus(); });
    document.addEventListener('input', () => { salvarEstado(); atualizarTodosStatus(); });

    // ── LIMPAR TUDO ────────────────────────────
    document.getElementById('limparBtn').addEventListener('click', () => {
      if (!confirm('Deseja limpar todos os dados preenchidos?')) return;
      localStorage.removeItem('livroOcorrencia');
      location.reload();
    });

    // ── INIT ───────────────────────────────────
    window.addEventListener('load', () => {
      restaurarEstado();
      atualizarTodosStatus();
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"></script>
</body>

</html>
